<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUDISMO COLOMBIA — Archivo Conceptual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F6F2;
      --fg: #121212;
      --muted: #787670;
      --line: #DFDDD6;
      --hover-bg: #EFECE6;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="dark"] {
      --bg: #0E0E0E;
      --fg: #EDEDEB;
      --muted: #757570;
      --line: #242422;
      --hover-bg: #171716;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.5s var(--ease), color 0.5s var(--ease);
      -webkit-font-smoothing: antialiased;
    }

    /* TOP BAR */
    header {
      height: 60px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
      z-index: 40;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    /* SEARCH COMMAND BAR */
    .search-box {
      position: relative;
      width: 280px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 28px 6px 12px;
      outline: none;
      transition: border-color 0.3s var(--ease), background-color 0.3s var(--ease);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--fg);
      background-color: var(--hover-bg);
    }

    .search-kbd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 0 4px;
      pointer-events: none;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 360px;
      background-color: var(--bg);
      border: 1px solid var(--fg);
      display: none;
      flex-direction: column;
      max-height: 360px;
      overflow-y: auto;
      z-index: 100;
    }

    .search-results.open {
      display: flex;
    }

    .search-result-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      transition: background-color 0.2s var(--ease);
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover,
    .search-result-item.selected {
      background-color: var(--hover-bg);
    }

    .sr-title {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      color: var(--fg);
    }

    .sr-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* NAV CONTROLS & CLICKABLE BREADCRUMB */
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
    }

    .step-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-link {
      cursor: pointer;
      transition: color 0.25s var(--ease);
      padding: 2px 4px;
    }

    .step-link:hover {
      color: var(--fg);
    }

    .step-link.active {
      color: var(--fg);
      border-bottom: 1px solid var(--fg);
    }

    .step-link.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .progress-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      border-left: 1px solid var(--line);
      padding-left: 16px;
    }

    .btn-minimal {
      background: none;
      border: 1px solid var(--line);
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .btn-minimal:hover {
      background-color: var(--hover-bg);
      border-color: var(--fg);
    }

    /* MAIN STAGE - ACCORDION ARCHITECTURE (FULL HEIGHT/WIDTH FIX) */
    main {
      flex: 1;
      display: flex;
      width: 100vw;
      height: calc(100vh - 60px);
      position: relative;
      overflow: hidden;
    }

    /* LAYER 1: PILARES (AXES) */
    .pillars-container {
      display: flex;
      flex-direction: row;
      height: 100%;
      width: 100vw;
      transition: width 0.7s var(--ease);
      flex-shrink: 0;
    }

    main.state-nodes .pillars-container {
      width: 250px;
    }

    main.state-card .pillars-container {
      width: 68px;
      flex-direction: column;
      border-right: 1px solid var(--line);
    }

    .pillar {
      flex: 1;
      height: 100%;
      border-right: 1px solid var(--line);
      padding: 44px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: flex 0.7s var(--ease), background-color 0.4s var(--ease), padding 0.6s var(--ease);
    }

    .pillar:last-child {
      border-right: none;
    }

    .pillar:hover {
      background-color: var(--hover-bg);
    }

    /* En state-nodes: ocultar ejes no activos sin dejar espacios vacíos */
    main.state-nodes .pillar:not(.active) {
      flex: 0 0 0px;
      width: 0;
      padding: 0;
      border: none;
      opacity: 0;
      pointer-events: none;
    }

    main.state-nodes .pillar.active {
      flex: 1;
      height: 100%;
      background-color: var(--bg);
      border-right: 1px solid var(--line);
      padding: 44px 28px;
    }

    /* En state-card: los 4 ejes ocupan 25% de altura cada uno formando una barra lateral */
    main.state-card .pillar {
      flex: 1;
      height: auto;
      padding: 16px 0;
      align-items: center;
      justify-content: center;
      border-right: none;
      border-bottom: 1px solid var(--line);
      opacity: 0.55;
    }

    main.state-card .pillar:last-child {
      border-bottom: none;
    }

    main.state-card .pillar:hover {
      opacity: 1;
      background-color: var(--hover-bg);
    }

    main.state-card .pillar.active {
      opacity: 1;
      background-color: var(--hover-bg);
      border-left: 3px solid var(--fg);
    }

    .pillar-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    main.state-card .pillar-num {
      display: none;
    }

    .pillar-center {
      margin: auto 0;
      transition: transform 0.6s var(--ease), opacity 0.4s var(--ease);
    }

    .pillar-pali {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 14px;
      display: block;
    }

    .pillar-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(38px, 3.8vw, 58px);
      font-weight: 400;
      line-height: 1.04;
      margin-bottom: 18px;
      transition: font-size 0.6s var(--ease);
    }

    main.state-nodes .pillar.active .pillar-title {
      font-size: 34px;
    }

    .pillar-desc {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.55;
      max-width: 30ch;
      transition: opacity 0.3s var(--ease);
    }

    .pillar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .pillar:hover .pillar-arrow {
      transform: translateX(6px);
    }

    .pillar-arrow {
      transition: transform 0.4s var(--ease);
    }

    .pillar-vertical-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg);
      display: none;
      white-space: nowrap;
    }

    main.state-card .pillar .pillar-center,
    main.state-card .pillar .pillar-footer {
      display: none;
    }

    main.state-card .pillar .pillar-vertical-label {
      display: block;
    }

    /* LAYER 2: NODOS (CONCEPT SELECTOR - FULL HEIGHT GRID FIX) */
    .nodes-stage {
      width: 0;
      height: 100%;
      opacity: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      transition: width 0.7s var(--ease), opacity 0.5s var(--ease);
      flex-shrink: 0;
    }

    main.state-nodes .nodes-stage {
      width: calc(100vw - 250px);
      opacity: 1;
    }

    main.state-card .nodes-stage {
      width: 310px;
      opacity: 1;
    }

    .stage-header {
      height: 54px;
      padding: 0 32px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .stage-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    /* FIX: Las filas ocupan exactamente el 50% de la altura para llenar toda la pantalla en 2 filas */
    .nodes-grid {
      flex: 1;
      height: calc(100% - 54px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: minmax(50%, 1fr);
      overflow-y: auto;
    }

    main.state-card .nodes-grid {
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(20%, auto);
    }

    .node-item {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 34px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.35s var(--ease), padding 0.5s var(--ease);
      opacity: 0;
      transform: translateY(14px);
      position: relative;
      height: 100%;
    }

    .node-item.reveal {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s var(--ease), transform 0.55s var(--ease), background-color 0.3s var(--ease);
    }

    .node-item:hover {
      background-color: var(--hover-bg);
    }

    .node-item.active {
      background-color: var(--hover-bg);
      border-left: 3px solid var(--fg);
    }

    main.state-card .node-item {
      padding: 20px 24px;
      border-right: none;
      height: auto;
    }

    .node-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    main.state-card .node-top {
      margin-bottom: 6px;
    }

    .node-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .read-dot {
      font-size: 9px;
      color: var(--muted);
    }

    .read-dot.is-read {
      color: var(--fg);
    }

    .node-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      padding: 2px 7px;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .node-name {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(30px, 2.5vw, 38px);
      font-weight: 400;
      line-height: 1.08;
      margin-bottom: 6px;
      transition: transform 0.3s var(--ease);
    }

    .node-item:hover .node-name {
      transform: translateX(4px);
    }

    main.state-card .node-name {
      font-size: 23px;
      margin-bottom: 2px;
    }

    .node-translation {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    main.state-card .node-translation {
      margin-bottom: 0;
      font-size: 11px;
    }

    .node-summary {
      font-size: 14px;
      line-height: 1.55;
      color: var(--fg);
      opacity: 0.85;
    }

    main.state-card .node-summary,
    main.state-card .node-bottom {
      display: none;
    }

    .node-bottom {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* LAYER 3: FICHA ATÓMICA (FULL HEIGHT FIX) */
    .card-stage {
      flex: 1;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transform: translateX(24px);
      transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
    }

    main.state-card .card-stage {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .card-inner {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100%;
      justify-content: space-between;
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
    }

    .card-inner.switching {
      opacity: 0;
      transform: translateY(10px);
    }

    .atomic-header {
      padding: 34px 48px 28px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-shrink: 0;
    }

    .atomic-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .atomic-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(36px, 4.2vw, 60px);
      font-weight: 400;
      line-height: 0.98;
    }

    .atomic-pali-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      border: 1px solid var(--line);
      padding: 8px 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    .atomic-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.12fr 1fr;
      grid-template-rows: 1fr auto;
    }

    .atomic-cell {
      padding: 36px 48px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .atomic-cell:first-child {
      border-right: 1px solid var(--line);
    }

    .cell-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cell-tag::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--fg);
    }

    .essence-quote {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(23px, 2.2vw, 31px);
      line-height: 1.28;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .essence-body {
      font-size: 15px;
      line-height: 1.68;
      color: var(--muted);
      max-width: 54ch;
    }

    .practice-steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto 0;
    }

    .practice-step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      align-items: baseline;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .practice-step:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .step-text {
      font-size: 14px;
      line-height: 1.5;
    }

    .step-text strong {
      font-weight: 500;
      display: block;
      margin-bottom: 2px;
    }

    .practice-timer-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .timer-display {
      font-size: 13px;
      color: var(--fg);
      letter-spacing: 0.08em;
    }

    .timer-bar-track {
      width: 100%;
      height: 1px;
      background-color: var(--line);
      position: relative;
      overflow: hidden;
    }

    .timer-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 1px;
      width: 0%;
      background-color: var(--fg);
      transition: width 0.25s linear;
    }

    .atomic-connections {
      grid-column: 1 / -1;
      padding: 20px 48px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .connections-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .conn-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .conn-chip {
      background: none;
      border: 1px solid var(--line);
      color: var(--fg);
      padding: 7px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.3s var(--ease), background-color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .conn-chip:hover {
      background-color: var(--hover-bg);
      border-color: var(--fg);
      transform: translateY(-2px);
    }

    .conn-chip span {
      color: var(--muted);
      font-size: 10px;
    }

    .session-trail {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 12px;
      overflow-x: auto;
    }

    .trail-node {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.2s var(--ease);
    }

    .trail-node:hover {
      color: var(--fg);
    }

    .trail-node.current {
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 1024px) {
      .search-box { width: 170px; }
      .progress-counter { display: none; }
      main.state-nodes .pillars-container { width: 68px; }
      main.state-nodes .nodes-stage { width: calc(100vw - 68px); }
      .nodes-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
      main.state-card .nodes-stage { display: none; }
      .atomic-grid { grid-template-columns: 1fr; }
      .atomic-cell:first-child { border-right: none; }
      .atomic-header, .atomic-cell, .atomic-connections { padding: 24px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <span class="brand-title">Budismo Colombia</span>
      <span class="brand-sub">/ Repositorio Conceptual</span>
    </div>

    <div class="search-box" id="searchBox">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Buscar entre 20 conceptos..."
        autocomplete="off"
      />
      <span class="search-kbd">/</span>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="nav-controls">
      <div class="step-indicator" id="breadcrumb">
        <span class="step-link active" onclick="resetToHome()">01. Ejes</span>
        <span>→</span>
        <span class="step-link disabled" id="bcNodes" onclick="goToNodesStep()">02. Nodos</span>
        <span>→</span>
        <span class="step-link disabled" id="bcCard">03. Ficha</span>
      </div>

      <span class="progress-counter" id="progressCounter" title="Conceptos estudiados guardados en tu navegador">0/20 Leídos</span>

            essence: "Samatha y Vipassanā son las dos alas de la práctica. Mientras el agua de un estanque esté revuelta por olas de prisa y preocupación, es imposible ver el fondo; Samatha decanta el sedimento mental.",
            steps: [
              { title: "Estabilizar la postura", desc: "Siéntate con la columna erguida pero sin rigidez, dejando caer el peso de los hombros." },
              { title: "Soltar la agenda por 5 minutos", desc: "Declara conscientemente que durante los próximos minutos no tienes ningún problema que resolver." },
              { title: "Descansar en la quietud", desc: "Nota el bienestar silencioso que aparece cuando la mente deja de saltar hacia el futuro." }
            ],
            source: "Samatha-vipassanā Sutta (AN 2.30)",
            connections: ["anapanasati", "samadhi", "vipassana", "nirodha"]
          },
          {
            id: "sampajanna",
            code: "04.4",
            type: "Práctica en Movimiento",
            name: "Sampajañña",
            pali: "सम्पजञ्ञ · Comprensión Clara",
            translation: "Lucidez en la acción cotidiana",
            summary: "Llevar la presencia meditativa fuera del cojín hacia el caminar, trabajar, hablar y decidir.",
            quote: "«Actúa con plena consciencia al avanzar y al retroceder, al hablar y al guardar silencio.»",
            essence: "Si Sati es recordar estar presente, Sampajañña es comprender con claridad qué estamos haciendo, por qué lo hacemos y si es adecuado al contexto mientras nos movemos en el mundo.",
            steps: [
              { title: "Transiciones conscientes", desc: "Al levantarte de la silla o abrir una puerta, siente el movimiento completo de principio a fin." },
              { title: "Claridad de propósito", desc: "Antes de iniciar una tarea o abrir una aplicación, pregúntate: ¿cuál es mi intención exacta aquí?" },
              { title: "Ritmo deliberado", desc: "Camina o escribe un 10% más pausado de lo habitual para desactivar la sensación de urgencia." }
            ],
            source: "Satipaṭṭhāna Sutta — Sección Sampajañña (MN 10)",
            connections: ["sati", "samma_vaca", "panna", "anapanasati"]
          },
          {
            id: "samma_vaca",
            code: "04.5",
            type: "Ética Aplicada",
            name: "Sammā Vācā",
            pali: "सम्मा वाचा · Habla Correcta",
            translation: "Comunicación veraz, útil y oportuna",
            summary: "Entrenamiento de la palabra escrita y hablada como extensión directa de la atención plena.",
            quote: "«Habla en el momento oportuno, con la verdad, con suavidad y solo de aquello que aporta valor.»",
            essence: "En el Noble Camino Óctuple, la ética (Sīla) no es un mandamiento moralista, sino una herramienta para no agitar nuestra propia mente. El Buda propuso un filtro de 4 preguntas antes de hablar: ¿Es verdadero? ¿Es útil? ¿Es amable? ¿Es el momento adecuado?",
            steps: [
              { title: "El filtro de las 4 puertas", desc: "Si lo que vas a decir es cierto pero inútil o agresivo, elige el silencio consciente." },
              { title: "Ayuno de queja y rumor", desc: "Pasa un día entero evitando comentarios despectivos sobre terceros o quejas repetitivas." },
              { title: "Escucha sin interrumpir", desc: "Escucha el argumento completo de tu interlocutor sin preparar tu defensa mientras él habla." }
            ],
            source: "Abhaya Sutta (MN 58)",
            connections: ["sampajanna", "karuna", "sati", "upekkha"]
          }
        ]
      }
    ];

    const TOTAL_NODES = REPOSITORY.reduce((acc, p) => acc + p.nodes.length, 0);

    let currentState = "pillars"; // "pillars" | "nodes" | "card"
    let activePillarId = null;
    let activeNodeId = null;

    let readNodes = new Set(JSON.parse(localStorage.getItem("bc_read_nodes") || "[]"));
    let sessionTrail = [];

    let timerInterval = null;
    let timerSeconds = 60;
    let timerRunning = false;

    let searchMatches = [];
    let searchSelectedIndex = 0;

    const stageEl = document.getElementById("stage");
    const pillarsContainer = document.getElementById("pillarsContainer");
    const nodesGrid = document.getElementById("nodesGrid");
    const cardStage = document.getElementById("cardStage");
    const backBtn = document.getElementById("backBtn");
    const breadcrumb = document.getElementById("breadcrumb");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    function normalizeText(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function init() {
      const savedTheme = localStorage.getItem("bc_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.getElementById("themeBtn").textContent = savedTheme === "dark" ? "Modo: Oscuro" : "Modo: Claro";

      renderPillars();
      updateProgressCounter();
      setupSearch();
      setupKeyboardNavigation();

      window.addEventListener("hashchange", syncFromHash);
      if (window.location.hash) {
        syncFromHash();
      } else {
        updateUIState();
      }
    }

    function renderPillars() {
      pillarsContainer.innerHTML = REPOSITORY.map(p => `
        <article class="pillar ${activePillarId === p.id ? 'active' : ''}" onclick="handlePillarClick('${p.id}')">
          <div class="pillar-num">${p.num} / 04</div>
          <div class="pillar-center">
            <span class="pillar-pali">${p.pali}</span>
            <h2 class="pillar-title">${p.title}</h2>
            <p class="pillar-desc">${p.desc}</p>
          </div>
          <div class="pillar-footer">
            <span>${p.nodes.length} Nodos</span>
            <span class="pillar-arrow">→</span>
          </div>
          <div class="pillar-vertical-label">${p.num} · ${p.title}</div>
        </article>
      `).join("");
    }

    function handlePillarClick(pillarId) {
      if (currentState === "card" && activePillarId !== pillarId) {
        const pillar = REPOSITORY.find(p => p.id === pillarId);
        activePillarId = pillarId;
        document.getElementById("nodesHeaderLabel").textContent = `Eje ${pillar.num} — ${pillar.title}`;
        renderPillars();
        renderNodes(pillar);
        selectNode(pillar.nodes[0].id);
        return;
      }
      selectPillar(pillarId);
    }

    function selectPillar(pillarId, updateHash = true) {
      stopPracticeTimer();
      activePillarId = pillarId;
      activeNodeId = null;
      currentState = "nodes";

      const pillar = REPOSITORY.find(p => p.id === pillarId);
      document.getElementById("nodesHeaderLabel").textContent = `Eje ${pillar.num} — ${pillar.title}`;

      renderPillars();
      renderNodes(pillar);
      updateUIState();

      if (updateHash) {
        history.replaceState(null, "", `#${pillarId}`);
      }
    }

    function renderNodes(pillar) {
      nodesGrid.innerHTML = pillar.nodes.map((n) => {
        const isRead = readNodes.has(n.id);
        return `
          <article class="node-item ${activeNodeId === n.id ? 'active' : ''}" id="node-${n.id}" onclick="selectNode('${n.id}')">
            <div>
              <div class="node-top">
                <span class="node-code">
                  <span class="read-dot ${isRead ? 'is-read' : ''}" title="${isRead ? 'Concepto estudiado' : 'Pendiente por leer'}">${isRead ? '●' : '○'}</span>
                  ${n.code}
                </span>
                <span class="node-type">${n.type}</span>
              </div>
              <h3 class="node-name">${n.name}</h3>
              <div class="node-translation">${n.translation}</div>
              <p class="node-summary">${n.summary}</p>
            </div>
            <div class="node-bottom">
              <span>${n.source}</span>
              <span>Abrir ficha →</span>
            </div>
          </article>
        `;
      }).join("");

      pillar.nodes.forEach((n, idx) => {
        setTimeout(() => {
          const el = document.getElementById(`node-${n.id}`);
          if (el) el.classList.add("reveal");
        }, 45 * (idx + 1));
      });
    }

    function findNodeById(nodeId) {
      for (const p of REPOSITORY) {
        const found = p.nodes.find(n => n.id === nodeId);
        if (found) return { pillar: p, node: found };
      }
      return null;
    }

    function selectNode(nodeId, updateHash = true) {
      const result = findNodeById(nodeId);
      if (!result) return;

      stopPracticeTimer();

      const wasAlreadyInCard = currentState === "card";

      if (activePillarId !== result.pillar.id) {
        activePillarId = result.pillar.id;
        document.getElementById("nodesHeaderLabel").textContent = `Eje ${result.pillar.num} — ${result.pillar.title}`;
        renderPillars();
        renderNodes(result.pillar);
      }

      activeNodeId = nodeId;
      currentState = "card";

      readNodes.add(nodeId);
      localStorage.setItem("bc_read_nodes", JSON.stringify([...readNodes]));
      updateProgressCounter();

      if (sessionTrail[sessionTrail.length - 1] !== nodeId) {
        sessionTrail.push(nodeId);
        if (sessionTrail.length > 8) sessionTrail.shift();
      }

      document.querySelectorAll(".node-item").forEach(el => el.classList.remove("active"));
      const activeEl = document.getElementById(`node-${nodeId}`);
      if (activeEl) {
        activeEl.classList.add("active");
        activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
        const dot = activeEl.querySelector(".read-dot");
        if (dot) {
          dot.classList.add("is-read");
          dot.textContent = "●";
        }
      }

      const existingInner = cardStage.querySelector(".card-inner");
      if (wasAlreadyInCard && existingInner) {
        existingInner.classList.add("switching");
        setTimeout(() => {
          renderAtomicCard(result.pillar, result.node);
        }, 170);
      } else {
        renderAtomicCard(result.pillar, result.node);
      }

      updateUIState();

      if (updateHash) {
        history.replaceState(null, "", `#${result.pillar.id}/${nodeId}`);
      }
    }

    function renderAtomicCard(pillar, node) {
      const connButtons = node.connections.map(connId => {
        const target = findNodeById(connId);
        if (!target) return "";
        return `
          <button class="conn-chip" onclick="selectNode('${target.node.id}')">
            ${target.node.name} <span>${target.node.translation} →</span>
          </button>
        `;
      }).join("");

      const stepsHtml = node.steps.map((s, i) => `
        <li class="practice-step">
          <span class="step-num">0${i + 1}</span>
          <div class="step-text">
            <strong>${s.title}</strong>
            ${s.desc}
          </div>
        </li>
      `).join("");

      const trailHtml = sessionTrail.map((tid, idx) => {
        const t = findNodeById(tid);
        if (!t) return "";
        const isCurrent = tid === node.id;
        return `
          ${idx > 0 ? '<span>→</span>' : ''}
          <button class="trail-node ${isCurrent ? 'current' : ''}" onclick="selectNode('${tid}')">${t.node.name}</button>
        `;
      }).join("");

      cardStage.innerHTML = `
        <div class="card-inner">
          <div class="atomic-header">
            <div>
              <div class="atomic-meta">
                <span>Eje ${pillar.num} · ${pillar.title}</span>
                <span>·</span>
                <span>${node.type}</span>
                <span>·</span>
                <span>Ref: ${node.source}</span>
              </div>
              <h1 class="atomic-title">${node.name} — <em>${node.translation}</em></h1>
            </div>
            <div class="atomic-pali-badge">${node.pali}</div>
          </div>

          <div class="atomic-grid">
            <div class="atomic-cell">
              <div>
                <div class="cell-tag">01. Síntesis Conceptual</div>
                <blockquote class="essence-quote">${node.quote}</blockquote>
                <p class="essence-body">${node.essence}</p>
              </div>
              <div class="stage-label" style="margin-top: 24px;">Lectura atómica · Sin ruido doctrinal</div>
            </div>

            <div class="atomic-cell">
              <div>
                <div class="cell-tag">02. Observación Práctica (3 pasos)</div>
                <ul class="practice-steps">
                  ${stepsHtml}
                </ul>
              </div>

              <div class="practice-timer-box">
                <div class="timer-row">
                  <span class="stage-label">Pausa de contemplación silenciosa</span>
                  <div style="display:flex; align-items:center; gap:12px;">
                    <span class="timer-display" id="timerDisplay">01:00</span>
                    <button class="btn-minimal" id="timerBtn" onclick="togglePracticeTimer()">Iniciar 1 min</button>
                  </div>
                </div>
                <div class="timer-bar-track">
                  <div class="timer-bar-fill" id="timerBarFill"></div>
                </div>
              </div>
            </div>

            <div class="atomic-connections">
              <div class="connections-row">
                <span class="stage-label">03. Conceptos Interconectados:</span>
                <div class="conn-list">
                  ${connButtons}
                </div>
              </div>

              <div class="session-trail">
                <span>Hilo de estudio:</span>
                ${trailHtml}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function togglePracticeTimer() {
      const btn = document.getElementById("timerBtn");
      if (!btn) return;

      if (timerRunning) {
        stopPracticeTimer();
        return;
      }

      timerRunning = true;
      timerSeconds = 60;
      btn.textContent = "Detener";

      timerInterval = setInterval(() => {
        timerSeconds--;
        const display = document.getElementById("timerDisplay");
        const bar = document.getElementById("timerBarFill");
        if (!display || !bar) {
          stopPracticeTimer();
          return;
        }

        const secs = String(timerSeconds).padStart(2, "0");
        display.textContent = `00:${secs}`;
        const progress = ((60 - timerSeconds) / 60) * 100;
        bar.style.width = `${progress}%`;

        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          timerRunning = false;
          display.textContent = "Completado";
          btn.textContent = "Reiniciar";
        }
      }, 1000);
    }

    function stopPracticeTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 60;
      const display = document.getElementById("timerDisplay");
      const bar = document.getElementById("timerBarFill");
      const btn = document.getElementById("timerBtn");
      if (display) display.textContent = "01:00";
      if (bar) bar.style.width = "0%";
      if (btn) btn.textContent = "Iniciar 1 min";
    }

    function setupSearch() {
      searchInput.addEventListener("input", () => {
        const q = normalizeText(searchInput.value.trim());
        if (!q) {
          closeSearch();
          return;
        }

        searchMatches = [];
        REPOSITORY.forEach(p => {
          p.nodes.forEach(n => {
            const haystack = normalizeText(`${n.name} ${n.translation} ${n.pali} ${n.summary} ${n.code} ${n.source}`);
            if (haystack.includes(q)) {
              searchMatches.push({ pillar: p, node: n });
            }
          });
        });

        searchSelectedIndex = 0;
        renderSearchResults();
      });

      searchInput.addEventListener("keydown", (e) => {
        if (!searchResults.classList.contains("open")) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();
          searchSelectedIndex = (searchSelectedIndex + 1) % Math.max(1, searchMatches.length);
          renderSearchResults();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          searchSelectedIndex = (searchSelectedIndex - 1 + Math.max(1, searchMatches.length)) % Math.max(1, searchMatches.length);
          renderSearchResults();
        } else if (e.key === "Enter" && searchMatches[searchSelectedIndex]) {
          e.preventDefault();
          const chosen = searchMatches[searchSelectedIndex];
          closeSearch();
          searchInput.blur();
          selectNode(chosen.node.id);
        }
      });

      document.addEventListener("click", (e) => {
        if (!document.getElementById("searchBox").contains(e.target)) {
          searchResults.classList.remove("open");
        }
      });
    }

    function renderSearchResults() {
      searchResults.classList.add("open");
      if (searchMatches.length === 0) {
        searchResults.innerHTML = `<div class="search-result-item"><span class="sr-meta">Sin coincidencias</span></div>`;
        return;
      }

      searchResults.innerHTML = searchMatches.map((item, idx) => `
        <div class="search-result-item ${idx === searchSelectedIndex ? 'selected' : ''}" onclick="pickSearchNode('${item.node.id}')">
          <div>
            <div class="sr-title">${item.node.name} — <em>${item.node.translation}</em></div>
            <div class="sr-meta">Eje ${item.pillar.num}: ${item.pillar.title}</div>
          </div>
          <span class="sr-meta">${item.node.code} ↵</span>
        </div>
      `).join("");
    }

    function pickSearchNode(nodeId) {
      closeSearch();
      selectNode(nodeId);
    }

    function closeSearch() {
      searchInput.value = "";
      searchMatches = [];
      searchResults.classList.remove("open");
    }

    function setupKeyboardNavigation() {
      window.addEventListener("keydown", (e) => {
        if ((e.key === "/" && document.activeElement !== searchInput) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          return;
        }

        if (e.key === "Escape") {
          if (document.activeElement === searchInput || searchResults.classList.contains("open")) {
            closeSearch();
            searchInput.blur();
          } else {
            stepBack();
          }
          return;
        }

        if (document.activeElement !== searchInput && activePillarId && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
          const pillar = REPOSITORY.find(p => p.id === activePillarId);
          if (!pillar) return;
          e.preventDefault();

          const currentIndex = pillar.nodes.findIndex(n => n.id === activeNodeId);
          let nextIndex = 0;
          if (currentIndex === -1) {
            nextIndex = 0;
          } else if (e.key === "ArrowDown") {
            nextIndex = (currentIndex + 1) % pillar.nodes.length;
          } else {
            nextIndex = (currentIndex - 1 + pillar.nodes.length) % pillar.nodes.length;
          }
          selectNode(pillar.nodes[nextIndex].id);
        }
      });
    }

    function goToNodesStep() {
      if (activePillarId && currentState === "card") {
        stepBack();
      }
    }

    function stepBack() {
      stopPracticeTimer();
      if (currentState === "card") {
        currentState = "nodes";
        activeNodeId = null;
        document.querySelectorAll(".node-item").forEach(el => el.classList.remove("active"));
        history.replaceState(null, "", `#${activePillarId}`);
      } else if (currentState === "nodes") {
        resetToHome();
        return;
      }
      updateUIState();
    }

    function resetToHome() {
      stopPracticeTimer();
      currentState = "pillars";
      activePillarId = null;
      activeNodeId = null;
      renderPillars();
      updateUIState();
      history.replaceState(null, "", window.location.pathname);
    }

    function syncFromHash() {
      const raw = window.location.hash.replace(/^#/, "");
      if (!raw) {
        resetToHome();
        return;
      }
      const [pillarPart, nodePart] = raw.split("/");
      const pillar = REPOSITORY.find(p => p.id === pillarPart);
      if (!pillar) return;

      if (nodePart) {
        selectNode(nodePart, false);
      } else {
        selectPillar(pillar.id, false);
      }
    }

    function updateUIState() {
      stageEl.className = "";
      if (currentState === "nodes") stageEl.classList.add("state-nodes");
      if (currentState === "card") stageEl.classList.add("state-card");

      backBtn.style.display = currentState === "pillars" ? "none" : "inline-block";

      const links = breadcrumb.querySelectorAll(".step-link");
      const bcNodes = document.getElementById("bcNodes");
      const bcCard = document.getElementById("bcCard");

      links[0].classList.toggle("active", currentState === "pillars");
      bcNodes.classList.toggle("active", currentState === "nodes");
      bcNodes.classList.toggle("disabled", currentState === "pillars");

      bcCard.classList.toggle("active", currentState === "card");
      bcCard.classList.toggle("disabled", currentState !== "card");
    }

    function updateProgressCounter() {
      const counter = document.getElementById("progressCounter");
      if (counter) {
        counter.textContent = `${readNodes.size}/${TOTAL_NODES} Leídos`;
      }
    }

    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.getAttribute("data-theme") === "dark";
      const nextTheme = isDark ? "light" : "dark";
      root.setAttribute("data-theme", nextTheme);
      localStorage.setItem("bc_theme", nextTheme);
      document.getElementById("themeBtn").textContent = isDark ? "Modo: Claro" : "Modo: Oscuro";
    }

    init();
  </script>
</body>
</html>
